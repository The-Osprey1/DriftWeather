[project]
name = "weather-station"
version = "1.0.0"
description = "Micro-weather station, astronomical trackers, and solar timelines for 32x8 RGB LED matrix displays"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "astropy>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["weather", "test_meridian.py"]
pythonpath = [".", "weather"]
markers = [
    "slow: tests that take more than 1 second",
    "integration: tests requiring network access or a live panel",
    "visual: tests that generate preview images",
]
addopts = "--strict-markers --tb=short"
